backend:
  name: turbo-github
  turbo_site_id: b22d80dd-1163-45c5-a856-e3b2e981356d
  branch: main

# This media path keeps uploaded assets inside the deployed static folder.
media_folder: "public/media/uploads"
public_folder: "/media/uploads"

site_url: https://kalkinbui.ca
display_url: https://kalkinbui.ca

collections:
  - name: "projects"
    label: "Projects"
    label_singular: "Project"
    folder: "public/content/projects"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Short description", name: "description", widget: "text" }
      - { label: "Category", name: "category", widget: "string" }
      - { label: "Status", name: "status", widget: "string", required: false }
      - { label: "Cover image", name: "cover", widget: "image", required: false }
      - { label: "Project link", name: "project_url", widget: "string", required: false }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "profile"
    label: "Profile"
    files:
      - label: "About page content"
        name: "about"
        file: "public/content/about.md"
        fields:
          - { label: "Headline", name: "headline", widget: "string" }
          - { label: "Intro", name: "intro", widget: "text" }
          - { label: "Body", name: "body", widget: "markdown" }
      - label: "Site settings"
        name: "settings"
        file: "public/content/settings.yml"
        fields:
          - { label: "Name", name: "name", widget: "string" }
          - { label: "Short tagline", name: "tagline", widget: "string" }
          - { label: "Contact email", name: "email", widget: "string" }
          - { label: "Location", name: "location", widget: "string" }

          
  - name: "homepage"
    label: "Homepage & Design"
    files:
      - label: "Homepage content"
        name: "homepage"
        file: "public/content/homepage.yml"
        fields:
          - { label: "Browser title", name: "site_title", widget: "string" }
          - { label: "SEO description", name: "site_description", widget: "text" }
          - { label: "Wordmark", name: "wordmark", widget: "string" }
          - { label: "Home navigation label", name: "nav_home", widget: "string" }
          - { label: "Projects navigation label", name: "nav_projects", widget: "string" }
          - { label: "About navigation label", name: "nav_about", widget: "string" }
          - { label: "Header contact label", name: "header_contact", widget: "string" }
          - { label: "Hero eyebrow", name: "hero_eyebrow", widget: "string" }
          - { label: "Hero location", name: "hero_location", widget: "string" }
          - { label: "Hero title line 1", name: "hero_title_1", widget: "string" }
          - { label: "Hero title line 2", name: "hero_title_2", widget: "string" }
          - { label: "Hero introduction", name: "hero_copy", widget: "text" }
          - { label: "Primary button label", name: "hero_primary_label", widget: "string" }
          - { label: "Secondary button label", name: "hero_secondary_label", widget: "string" }
          - { label: "Selected work label", name: "selected_label", widget: "string" }
          - { label: "Selected work title", name: "selected_title", widget: "string" }
          - { label: "View all projects label", name: "selected_link_label", widget: "string" }
          - { label: "Bottom banner eyebrow", name: "bottom_eyebrow", widget: "string" }
          - { label: "Bottom banner title line 1", name: "bottom_title_1", widget: "string" }
          - { label: "Bottom banner title line 2", name: "bottom_title_2", widget: "string" }
          - { label: "Bottom banner button label", name: "bottom_button_label", widget: "string" }
          - { label: "Footer tagline", name: "footer_tagline", widget: "string" }
          - { label: "Projects page eyebrow", name: "projects_eyebrow", widget: "string" }
          - { label: "Projects page title line 1", name: "projects_title_1", widget: "string" }
          - { label: "Projects page title line 2", name: "projects_title_2", widget: "string" }
          - { label: "Projects page introduction", name: "projects_intro", widget: "text" }
          - { label: "About page eyebrow", name: "about_eyebrow", widget: "string" }
          - { label: "About section label", name: "about_section_label", widget: "string" }
          - { label: "About focus", name: "about_focus", widget: "string" }
          - { label: "Currently working on", name: "about_currently", widget: "string" }
          - { label: "Open to", name: "about_open_to", widget: "string" }
          - { label: "Contact email", name: "email", widget: "string" }

